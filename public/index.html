<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gradify — Simplify Your Academic Journey</title>
  <meta name="description" content="Gradify adalah Academic & Computer Science Super-App untuk mahasiswa UNIKA UST dan universitas lainnya." />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81'
            }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- Markdown + Syntax highlighting (Catatan Perkuliahan CS) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css" crossorigin="anonymous" />
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/highlight.min.js"></script>

  <!-- MathJax LaTeX Renderer -->
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }, svg: { fontCache: 'global' } };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
</head>
<body class="bg-slate-100 font-sans text-slate-800">

  <!-- Splash -->
  <div id="splash" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-gradient-to-br from-indigo-700 via-indigo-600 to-violet-700 text-white">
    <div class="text-6xl mb-4 animate-bounce">🎓</div>
    <h1 id="splash-name" class="text-3xl font-extrabold tracking-tight">Gradify</h1>
    <p id="splash-tagline" class="mt-2 text-indigo-200 italic">Simplify Your Academic Journey</p>
  </div>

  <!-- Auth overlay (login/register) -->
  <div id="auth-screen" class="hidden fixed inset-0 z-40 overflow-y-auto bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900"></div>

  <!-- App shell -->
  <div id="app-shell" class="hidden min-h-screen flex flex-col lg:flex-row">

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 max-w-[85vw] lg:w-64 -translate-x-full lg:translate-x-0 transform bg-slate-900 text-slate-300 transition-transform duration-200 ease-in-out flex flex-col shadow-2xl lg:shadow-none">
      <div class="flex items-center justify-between px-5 h-16 border-b border-slate-800">
        <div class="flex items-center gap-3">
          <span class="text-2xl">🎓</span>
          <div>
            <p id="brand-name" class="text-white font-bold leading-tight">Gradify</p>
            <p class="text-[10px] text-indigo-400 tracking-widest uppercase">v1.0.0</p>
          </div>
        </div>
        <!-- Close button for mobile drawer -->
        <button id="btn-sidebar-close" class="lg:hidden p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition" aria-label="Tutup menu">✕</button>
      </div>
      <div id="sidebar-profile" class="px-5 py-3 border-b border-slate-800 flex items-center gap-3"></div>
      <nav id="sidebar-nav" class="flex-1 overflow-y-auto px-3 py-4 space-y-6"></nav>
      <div class="px-5 py-3 border-t border-slate-800 text-[11px] text-slate-500">© 2026 Gradify<br/>Built for Academic Excellence</div>
    </aside>
    <div id="sidebar-backdrop" class="hidden fixed inset-0 z-40 bg-black/60 backdrop-blur-sm lg:hidden transition-opacity"></div>

    <!-- Main -->
    <main class="flex-1 lg:ml-64 min-h-screen flex flex-col">
      <!-- Topbar -->
      <header class="sticky top-0 z-20 h-16 bg-white/90 backdrop-blur border-b border-slate-200 flex items-center justify-between gap-2 sm:gap-3 px-3 sm:px-4 lg:px-8">
        <button id="btn-mobile-menu" class="lg:hidden p-2 rounded-lg text-slate-700 hover:bg-slate-100 shrink-0" aria-label="Buka menu">☰</button>
        <div class="flex-1 min-w-0 pr-1">
          <h1 id="page-title" class="text-base sm:text-lg font-bold text-slate-800 truncate">Dashboard</h1>
          <p id="page-subtitle" class="text-[11px] sm:text-xs text-slate-500 truncate hidden xs:block sm:block">Selamat belajar!</p>
        </div>
        <select id="semester-switcher" class="text-xs sm:text-sm border border-slate-300 rounded-lg px-2 sm:px-3 py-1.5 sm:py-2 bg-white max-w-[125px] sm:max-w-[200px] truncate outline-none focus:ring-2 focus:ring-indigo-300" title="Semester Switcher"></select>
        <div id="topbar-avatar" class="shrink-0 cursor-pointer"></div>
      </header>
      <div id="global-announcement" class="hidden mx-3.5 sm:mx-5 lg:mx-8 mt-4 rounded-xl border border-amber-200 bg-amber-50 text-amber-900 px-4 py-3 text-sm shadow-sm"></div>
      <div id="main-content" class="flex-1 p-3.5 sm:p-5 lg:p-8 pb-24 lg:pb-8"></div>
    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav id="mobile-bottom-nav" class="lg:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur border-t border-slate-200 px-2 py-1 safe-bottom flex items-center justify-around shadow-lg">
      <button data-route="dashboard" class="bnav-btn flex flex-col items-center py-1 px-2 rounded-xl text-slate-500 hover:text-indigo-600 transition" aria-label="Dashboard">
        <span class="text-lg leading-none pointer-events-none">🏠</span>
        <span class="text-[10px] font-medium mt-1 pointer-events-none">Beranda</span>
      </button>
      <button data-route="courses" class="bnav-btn flex flex-col items-center py-1 px-2 rounded-xl text-slate-500 hover:text-indigo-600 transition" aria-label="Mata Kuliah">
        <span class="text-lg leading-none pointer-events-none">📚</span>
        <span class="text-[10px] font-medium mt-1 pointer-events-none">Matkul</span>
      </button>
      <button data-route="notes" class="bnav-btn flex flex-col items-center py-1 px-2 rounded-xl text-slate-500 hover:text-indigo-600 transition" aria-label="Catatan CS">
        <span class="text-lg leading-none pointer-events-none">📝</span>
        <span class="text-[10px] font-medium mt-1 pointer-events-none">Catatan</span>
      </button>
      <button data-route="calculator" class="bnav-btn flex flex-col items-center py-1 px-2 rounded-xl text-slate-500 hover:text-indigo-600 transition" aria-label="Kalkulator">
        <span class="text-lg leading-none pointer-events-none">🧮</span>
        <span class="text-[10px] font-medium mt-1 pointer-events-none">Hitung</span>
      </button>
      <button id="bnav-menu-btn" class="flex flex-col items-center py-1 px-2 rounded-xl text-slate-500 hover:text-indigo-600 transition" aria-label="Semua Menu">
        <span class="text-lg leading-none pointer-events-none">☰</span>
        <span class="text-[10px] font-medium mt-1 pointer-events-none">Menu</span>
      </button>
    </nav>
  </div>

  <!-- Toast -->
  <div id="toast-container" class="fixed bottom-20 lg:bottom-4 right-4 left-4 sm:left-auto sm:w-auto z-[60] space-y-2 pointer-events-none"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
